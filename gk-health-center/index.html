<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G&amp;K Health Center | Tutepani Pharmacy, Chapagaun Dobato, Lalitpur</title>
<meta name="description" content="G&K Health Center and Tutepani Pharmacy, Chapagaun Dobato, Lalitpur. Medicines, injections, wound dressing, video X-ray, ECG, lab tests, specialist doctors, physiotherapy and home service.">
<meta name="theme-color" content="#302F26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Tiro+Devanagari+Hindi:ital@0;1&family=Manrope:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 60% ivory · 30% midnight · 10% champagne gold. Red only inside the logo cross. */
:root{
  /* 60% warm ivory · 30% deep forest · 10% muted champagne · sage + graphite support */
  --ivory:#F5F0E5; --ivory-2:#EFE7D6; --card:#FFFFFF; --sage:#DCE5D5;
  --night:#302F26; --night-2:#3A392F; --night-3:#45443A;
  --gold:#C6A878; --gold-text:#7A5F33; --gold-soft:#E5D8BF;
  --ink:#302F26; --muted:#5E5B4E; --line:#E3DACA; --line-dark:rgba(198,168,120,.22);
  --serif:'Cormorant Garamond','Tiro Devanagari Hindi',Georgia,serif;
  --sans:'DM Sans','Mukta',system-ui,sans-serif;
  --ui:'Manrope','Mukta',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:16.5px;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:40px}
@media(max-width:1024px){.wrap{padding-inline:28px}}
@media(max-width:640px){.wrap{padding-inline:20px}}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.12;letter-spacing:-.01em;font-variant-numeric:lining-nums}
html[lang="ne"] h1,html[lang="ne"] h2,html[lang="ne"] h3{line-height:1.3;letter-spacing:0}
em{font-style:italic;color:var(--gold-text)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-text)}
.eyebrow:before{content:"";width:32px;height:1px;background:currentColor}
html[lang="ne"] .eyebrow{font-size:14px;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;transition:transform .3s var(--ease),background .3s,color .3s,box-shadow .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:var(--night);box-shadow:0 14px 30px rgba(198,168,120,.28)}
.btn-gold:hover{background:var(--gold-soft)}
.btn-night{background:var(--night);color:var(--ivory)}
.btn-night:hover{background:var(--night-3)}
.btn-ghost{border:1px solid rgba(228,214,186,.45);color:var(--ivory)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

/* demo bars */
.demo{background:var(--night);color:var(--gold-soft);text-align:center;font-size:12.5px;letter-spacing:.03em;padding:8px 14px}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(248,245,239,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:50%;background:var(--night);border:1px solid rgba(198,168,120,.6);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;color:var(--night)}
.brand small{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.links{display:flex;gap:34px;font-size:15px;font-weight:600;color:var(--muted)}
.links a{position:relative;padding:6px 0}
.links a:after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--gold);transition:right .35s var(--ease)}
.links a:hover{color:var(--night)}.links a:hover:after{right:0}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px var(--sans);color:var(--night);cursor:pointer}
.nav-r .btn{height:44px;padding:0 20px;font-size:14px}
@media(max-width:960px){.links{display:none}}
@media(max-width:520px){.nav-r .btn{display:none}.brand b{font-size:21px}}

/* hero */
.hero{position:relative;background:var(--night);color:var(--ivory);overflow:hidden;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 85% 20%,rgba(198,168,120,.10),transparent 60%),radial-gradient(60% 70% at 0% 100%,rgba(85,107,47,.35),transparent 60%);z-index:-2}
#aurora{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.85}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding:96px 0 72px}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(38px,4.8vw,64px);color:var(--ivory);margin:22px 0 22px}
.hero h1 em{color:var(--gold)}
.hero p.lead{font-size:18px;color:#C3CEC6;max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:28px;font-size:14px;color:#A9B7AE}
.meta span{display:inline-flex;align-items:center;gap:8px}
.meta svg{flex:none}
.portrait{position:relative;justify-self:end;width:min(100%,440px)}
.portrait:before{content:"";position:absolute;inset:-18px 18px 18px -18px;border:1px solid rgba(198,168,120,.55);border-radius:220px 220px 28px 28px}
.portrait .ph{position:relative;aspect-ratio:4/5;border-radius:210px 210px 24px 24px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.35)}
.portrait .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.6s var(--ease)}
.portrait:hover .ph img{transform:scale(1.1)}
.glass{position:absolute;left:-36px;bottom:42px;display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border-radius:18px;background:rgba(48,47,38,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(228,214,186,.28);color:var(--ivory);box-shadow:0 20px 40px rgba(0,0,0,.3);animation:float 6s ease-in-out infinite}
.glass .gi{width:42px;height:42px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.glass small{display:block;font-size:12px;color:var(--gold-soft);letter-spacing:.04em}
.glass b{display:block;font-size:16px;font-weight:700}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tag{position:absolute;right:14px;bottom:14px;font-size:11px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:rgba(48,47,38,.7);color:var(--gold-soft)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-dark)}
.fact{padding:28px 24px 34px;border-left:1px solid var(--line-dark)}
.fact:first-child{border-left:0;padding-left:0}
.fact b{display:block;font-family:var(--serif);font-size:38px;font-weight:600;color:var(--gold);line-height:1.1}
.fact span{font-size:14px;color:#B4C1B8}
@media(max-width:960px){.hero-in{grid-template-columns:1fr;gap:56px;padding:72px 0 56px}.portrait{justify-self:center}.glass{left:-10px}}
@media(max-width:720px){.facts{grid-template-columns:repeat(2,1fr)}.fact{padding:22px 16px 24px}.fact:nth-child(3){border-left:0;padding-left:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line-dark)}}
@media(max-width:520px){.portrait:before{inset:-10px 10px 10px -10px}}
@media(max-width:420px){.btn{width:100%}.glass{left:8px;bottom:20px}}

/* sections */
section{padding:112px 0}
@media(max-width:1024px){section{padding:84px 0}}
@media(max-width:640px){section{padding:64px 0}}
.head{max-width:640px;margin-bottom:56px}
.head.center{margin-inline:auto;text-align:center}
.head.center .eyebrow:after{content:"";width:32px;height:1px;background:currentColor}
.head h2{font-size:clamp(32px,4vw,52px);margin-top:16px;color:var(--night)}
.head p{margin-top:16px;color:var(--muted);font-size:17px}

/* services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
@media(max-width:1024px){.svc{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.svc{grid-template-columns:1fr;gap:22px}}
.s{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .5s}
.s:hover{transform:translateY(-6px);box-shadow:0 30px 60px rgba(48,47,38,.10);border-color:rgba(198,168,120,.6)}
.s .ph{aspect-ratio:4/3;overflow:hidden;background:var(--ivory-2)}
.s .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.s:hover .ph img{transform:scale(1.06)}
.s .bd{padding:22px 24px 26px}
.s .no{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--gold-text)}
.s h3{font-size:24px;color:var(--night);margin:4px 0 8px}
.s p{font-size:15px;color:var(--muted)}

/* specialists */
.spec{background:var(--ivory-2);overflow:hidden}
.home,#visit{overflow:hidden}
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:80px;align-items:center}
.frame{position:relative}
.frame:before{content:"";position:absolute;inset:22px -22px -22px 22px;border:1px solid rgba(198,168,120,.6);border-radius:24px}
.frame .ph{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px rgba(48,47,38,.15)}
.frame .ph img{width:100%;height:100%;object-fit:cover}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.li{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:22px;font-weight:600;color:var(--night)}
html[lang="ne"] .li{font-size:20px}
.li i{width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none}
.note{margin-top:26px;font-size:15px;color:var(--muted)}
.note a{color:var(--gold-text);font-weight:700;border-bottom:1px solid rgba(122,92,36,.4)}
@media(max-width:960px){.split{grid-template-columns:1fr;gap:56px}.frame{max-width:440px}}
@media(max-width:520px){.list{grid-template-columns:1fr}}

/* home service */
.home{background:var(--night);color:var(--ivory);position:relative;overflow:hidden}
.home:before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(198,168,120,.14),transparent 65%);right:-220px;top:-220px}
.home .split{grid-template-columns:1.05fr .95fr;position:relative}
.home .eyebrow{color:var(--gold)}
.home h2{color:var(--ivory)}
.home .head p{color:#C3CEC6}
.steps{margin-top:8px}
.st{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line-dark)}
.st b{font-family:var(--serif);font-style:italic;font-size:40px;line-height:1;color:var(--gold)}
.st h3{font-family:var(--sans);font-size:17px;font-weight:700;color:var(--ivory)}
.st p{font-size:15px;color:#A9B7AE;margin-top:2px}
.home .btn{margin-top:30px}
.wide{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 40px 80px rgba(0,0,0,.35);border:1px solid rgba(228,214,186,.18)}
.wide img{width:100%;height:100%;object-fit:cover}
@media(max-width:960px){.home .split{grid-template-columns:1fr}}

/* visit */
.visit{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:stretch}
.info{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 32px}
.row{display:flex;gap:18px;align-items:flex-start;padding:22px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{width:44px;height:44px;border-radius:50%;border:1px solid rgba(198,168,120,.6);display:grid;place-items:center;flex:none}
.row small{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
html[lang="ne"] .row small{letter-spacing:.02em;font-size:13px}
.row b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--night);line-height:1.3;font-variant-numeric:lining-nums}
.row a b:hover{color:var(--gold-text)}
.map{position:relative;border-radius:24px;overflow:hidden;min-height:420px;background:var(--ivory-2);border:1px solid var(--line)}
.map a.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:var(--serif);font-size:24px;color:var(--night)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(.35) contrast(1.05)}
@media(max-width:960px){.visit{grid-template-columns:1fr}.map{min-height:340px}}

/* final */
.final{padding:0 0 112px}
.panel{position:relative;overflow:hidden;background:var(--night);border-radius:32px;padding:80px 40px;text-align:center;color:var(--ivory);border:1px solid rgba(198,168,120,.35)}
.panel:before{content:"";position:absolute;inset:14px;border:1px solid rgba(198,168,120,.18);border-radius:22px;pointer-events:none}
.panel:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(198,168,120,.2),transparent 65%);left:50%;top:-300px;transform:translateX(-50%)}
.panel > *{position:relative}
.panel h2{font-size:clamp(32px,4.4vw,56px);color:var(--ivory)}
.panel h2 em{color:var(--gold)}
.panel p{color:#C3CEC6;margin:14px auto 34px;max-width:520px}
.panel .cta{justify-content:center;margin-top:0}
@media(max-width:640px){.panel{padding:56px 22px}.final{padding-bottom:64px}}
footer{border-top:1px solid var(--line);padding:36px 0;text-align:center;font-size:14px;color:var(--muted)}
footer b{font-family:var(--serif);font-size:20px;color:var(--night)}

/* mobile call bar */
.bar{display:none}
@media(max-width:720px){
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:70;padding:8px;border-radius:999px;background:rgba(48,47,38,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 40px rgba(0,0,0,.3)}
  .bar a{height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .bar .a1{background:var(--gold);color:var(--night)}.bar .a2{color:var(--ivory);border:1px solid rgba(228,214,186,.35)}
  body{padding-bottom:84px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* ---- v6 luxury refinements: whitespace, thin borders, restrained motion ---- */
body{font-family:var(--sans);color:var(--ink);font-size:16.5px}
.btn,.lang,.links,.eyebrow,.row small,.fact span,.glass,.bar a,.demo{font-family:var(--ui)}
h1,h2,h3{font-weight:500;letter-spacing:-.015em}
html[lang="ne"] h1,html[lang="ne"] h2,html[lang="ne"] h3{font-weight:400}
.hero h1{font-weight:500}
section{padding:128px 0}
@media(max-width:1024px){section{padding:96px 0}}
@media(max-width:640px){section{padding:72px 0}}
.head{margin-bottom:64px}
.s{border-radius:16px;box-shadow:none}
.s:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(48,47,38,.07)}
.s .bd{padding:24px 26px 28px}
.s h3{font-size:25px}
.frame .ph,.wide,.info,.map{border-radius:16px}
.frame:before{border-radius:16px}
.frame .ph{box-shadow:none;border:1px solid var(--line)}
.portrait .ph{box-shadow:0 30px 60px rgba(0,0,0,.25)}
.spec{background:var(--sage)}
.spec .li{border-bottom-color:rgba(41,45,43,.14)}
.spec .head p,.spec .note{color:#4C534F}
.info{background:var(--card)}
.panel{border-radius:20px}.panel:before{border-radius:12px}
.btn{height:50px;font-weight:600;letter-spacing:.03em}
.btn-gold{box-shadow:none}
.btn-gold:hover{background:var(--gold-soft)}
.mark{border-color:rgba(198,168,120,.7)}
.reveal{transform:translateY(18px);transition-duration:1.2s}
.li i{width:6px;height:6px}

/* ---- v7 blueprint: Manrope headings, DM Sans body, precise radii, no glass ---- */
.wrap{max-width:1240px}
h1,h2,h3{font-family:'Manrope','Mukta',system-ui,sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.1}
html[lang="ne"] h1,html[lang="ne"] h2,html[lang="ne"] h3{font-weight:600;letter-spacing:0;line-height:1.28}
em{font-style:normal;color:var(--gold-text)}
.hero h1{font-weight:600;font-size:clamp(36px,4.6vw,66px)}
.hero h1 em{color:var(--gold)}
h2{font-size:clamp(32px,3.6vw,50px)}
.s h3{font-size:21px;font-weight:600}
.btn{border-radius:8px;height:52px}
.lang{border-radius:8px}
.s{border-radius:12px}
.portrait:before{border-radius:14px;inset:-16px 16px 16px -16px}
.portrait .ph{border-radius:12px;aspect-ratio:4/5}
.frame .ph,.frame:before{border-radius:12px}
.info,.map{border-radius:12px}
.panel{border-radius:14px}.panel:before{border-radius:8px}
.fact{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.fact .fi{grid-row:span 2}
.fact b{font-family:'Manrope','Mukta',sans-serif;font-size:19px;font-weight:600;color:var(--ivory);line-height:1.3}
.fact span{grid-column:2}
.spec{background:var(--ivory-2)}
.exp{background:var(--sage)}
.exp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.x{background:var(--card);border:1px solid rgba(41,45,43,.08);border-radius:12px;padding:32px 28px}
.x h3{font-size:20px;margin:22px 0 10px}.x p{color:var(--muted);font-size:15.5px}
.res-g{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.r{border-top:1px solid var(--gold);padding:28px 4px 0}
.r .no{font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--gold-text)}
.r h3{font-size:22px;margin:14px 0 12px}.r p{color:var(--muted)}
@media(max-width:1024px){.exp-g{grid-template-columns:1fr 1fr}.res-g{grid-template-columns:1fr}}
@media(max-width:560px){.exp-g{grid-template-columns:1fr}}
footer{background:var(--night);color:#B4C1B8;border-top:0;padding:56px 0 40px;text-align:left}
.ft{display:flex;flex-wrap:wrap;gap:28px 48px;justify-content:space-between;align-items:flex-start}
.ft b{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:20px;color:var(--ivory);margin-bottom:6px}
.ft nav,.ft .fc{display:flex;flex-wrap:wrap;gap:12px 26px}
.ft a{color:#C3CEC6;font-family:var(--ui);font-size:14.5px}.ft a:hover{color:var(--gold)}
.home em,.final em,.panel em{color:var(--gold)}
.row b,.info b{font-family:'Manrope','Mukta',sans-serif;font-weight:600}
.bar a{border-radius:8px}

/* ---- v8 directive pass ---- */
.nav{height:88px}
.hero-in{grid-template-columns:.82fr 1.18fr;gap:72px;padding:104px 0 80px}
.portrait{justify-self:stretch;width:100%}
.portrait .ph{aspect-ratio:5/4}
.hero h1{font-size:clamp(38px,5vw,72px);font-weight:500}
html[lang="ne"] .hero h1{font-weight:600}
h2{font-size:clamp(30px,3.4vw,46px);font-weight:500}
html[lang="ne"] h2{font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.16em}
section em,.head em{color:#556B2F}
.home em,.final em,.panel em,.hero em{color:var(--gold)}
.s .no{font-family:'Manrope',sans-serif;font-style:normal;font-size:13px;letter-spacing:.14em;font-weight:600}
.s,.s .ph img,.btn,.x,.links a{transition-duration:.3s}
.s:hover .ph img{transform:scale(1.035)}
.s:hover{transform:translateY(-3px)}
.reveal{transition-duration:.8s}
.btn:hover{transform:none}
.lang{border-radius:8px}
.menu-btn{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);align-items:center;justify-content:center;cursor:pointer}
.menu-btn i,.menu-btn i:before,.menu-btn i:after{display:block;width:18px;height:1.5px;background:var(--night);position:relative;transition:transform .3s,background .3s}
.menu-btn i:before,.menu-btn i:after{content:"";position:absolute;left:0}
.menu-btn i:before{top:-6px}.menu-btn i:after{top:6px}
.menu-open .menu-btn i{background:transparent}
.menu-open .menu-btn i:before{transform:translateY(6px) rotate(45deg)}
.menu-open .menu-btn i:after{transform:translateY(-6px) rotate(-45deg)}
.mnav{display:none}
@media(max-width:960px){

}

/* ---- v9 exact directive: ivory hero, no constant motion, forest primary buttons ---- */
.hero{background:var(--ivory)!important;color:var(--ink)}

#aurora{display:none!important}
.hero-in{grid-template-columns:.9fr 1.1fr;gap:64px}

.fact b{color:var(--night)}
.fact span{color:#5E5B4E}
.fact .fi{stroke:#7A5F33}
/* primary = forest, secondary = thin border */

.hero .btn-gold:hover{background:var(--night-3)}

@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}@keyframes fade{to{opacity:1}}@keyframes up{to{transform:none}}@keyframes grow{to{width:100%}}
@media(max-width:480px){#intro h4{font-size:30px}}

body.intro-on{overflow:hidden}

    amplitude: 1.0, blend: 0.6, speed: 0.4, height: 0.5, scale: 0.9,
    glow: 0.55, brightness: 1.1, layers: 2, flip: 0,
    mouseInteraction: true, intro: true, opacity: 0.85, lightMode: true, paused: false
  };

  window.initAurora = function (canvas) {
    if (!canvas) return false;
    var container = canvas.parentElement;
    var gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
    if (!container || !gl) { canvas.style.display = 'none'; return false; }
    var prog = link(gl);
    if (!prog) { canvas.style.display = 'none'; return false; }
    var u = prog.uniforms;

    var buffer = gl.createBuffer();
    var vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    var probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    var reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;
    var cache = new Map();
    function parse(value) {
      if (cache.has(value)) return cache.get(value);
      var rgb = [1, 1, 1];
      if (probe) {
        probe.clearRect(0, 0, 1, 1);
        probe.fillStyle = '#ffffff';
        probe.fillStyle = value;
        probe.fillRect(0, 0, 1, 1);
        var d = probe.getImageData(0, 0, 1, 1).data;
        rgb = [d[0] / 255, d[1] / 255, d[2] / 255];
      }
      cache.set(value, rgb);
      return rgb;
    }
    var palette = new Float32Array(MAX_STOPS * 3);
    var view = { width: 1, height: 1 };
    var pointer = { x: 0, y: 0, inside: false };
    var state = { clock: 0, px: 0, py: 0.5, reach: 0, reveal: (S.intro && !reduce) ? 0 : 1 };
    var raf = 0, last = 0, visible = true;

    function render() {
      unwrapHues(S.stops.map(function (v) { return toOklch(parse(v)); })).forEach(function (stop, i) { palette.set(stop, i * 3); });
      var reveal = state.reveal;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(prog.program);
      gl.bindVertexArray(vao);
      gl.uniform2f(u.uResolution, canvas.width, canvas.height);
      gl.uniform1f(u.uTime, state.clock);
      gl.uniform3fv(u.uStops, palette);
      gl.uniform1i(u.uStopCount, S.stops.length);
      gl.uniform1f(u.uAmplitude, S.amplitude);
      gl.uniform1f(u.uBlend, S.blend);
      gl.uniform1f(u.uHeight, S.height);
      gl.uniform1f(u.uScale, S.scale);
      gl.uniform1f(u.uGlow, S.glow);
      gl.uniform1f(u.uBrightness, S.brightness);
      gl.uniform1i(u.uLayers, S.layers);
      gl.uniform1f(u.uFlip, S.flip);
      gl.uniform3f(u.uPointer, state.px, state.py, state.reach);
      gl.uniform1f(u.uReveal, 1 - Math.pow(1 - reveal, 3));
      gl.uniform1f(u.uOpacity, S.opacity);
      gl.uniform1f(u.uLightMode, S.lightMode ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    var frameTick = 0;
    function frame(now) {
      raf = 0;
      if (!visible || document.hidden) return;
      var dt = last ? clamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
      last = now;
      if (S.paused) { state.reveal = 1; render(); last = 0; return; }
      var motion = reduce ? 0 : 1;
      state.clock += dt * S.speed * motion;
      var engaged = S.mouseInteraction && pointer.inside && !reduce;
      var follow = 1 - Math.exp(-dt / 0.6);
      if (engaged) {
        var tx = (pointer.x - view.width / 2) / view.height;
        var ty = S.flip ? 1 - pointer.y / view.height : pointer.y / view.height;
        state.px += (tx - state.px) * follow;
        state.py += (ty - state.py) * follow;
      }
      state.reach += ((engaged ? 1 : 0) - state.reach) * (1 - Math.exp(-dt / (engaged ? 0.9 : 1.4)));
      if (!S.intro || reduce) state.reveal = 1;
      else if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / INTRO_SECONDS);
      if ((frameTick = (frameTick || 0) + 1) % 2 === 0) render();
      raf = requestAnimationFrame(frame);
    }

    function wake() { if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame); }

    function resize() {
      var width = Math.max(1, window.innerWidth || container.clientWidth);
      var height = Math.max(1, window.innerHeight || container.clientHeight);
      var ratio = Math.min(window.devicePixelRatio || 1, 1.5) * 0.55;
      view.width = width; view.height = height;
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      render(); wake();
    }

    function onPointerMove(e) {
      var rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      var wasInside = pointer.inside;
      pointer.inside = pointer.x >= 0 && pointer.y >= 0 && pointer.x <= rect.width && pointer.y <= rect.height;
      if (pointer.inside && !wasInside) {
        state.px = (pointer.x - rect.width / 2) / Math.max(1, rect.height);
        state.py = S.flip ? 1 - pointer.y / Math.max(1, rect.height) : pointer.y / Math.max(1, rect.height);
      }
      if (!S.paused) wake();
    }
    function onPointerUp(e) { if (e.pointerType !== 'mouse') pointer.inside = false; }
    function onPointerLeave() { pointer.inside = false; }
    function onVisibility() { last = 0; wake(); }

    var ro = new ResizeObserver(resize); ro.observe(container);
    var io = new IntersectionObserver(function (es) {
      visible = es.some(function (e) { return e.isIntersecting; });
      if (visible) { last = 0; wake(); }
    });
    io.observe(canvas);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerMove, { passive: true });
    window.addEventListener('pointerup', onPointerUp, { passive: true });
    window.addEventListener('pointercancel', onPointerUp, { passive: true });
    document.documentElement.addEventListener('pointerleave', onPointerLeave);
    document.addEventListener('visibilitychange', onVisibility);
    resize();
    return true;
  };
})();
</script>
